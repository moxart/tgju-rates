[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tgju-rates"
dynamic = ["version"]
description = "Live Iranian rial exchange rates from tgju.org in your terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["tgju", "currency", "exchange-rate", "rial", "terminal", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.scripts]
tgju-rates = "tgju_rates.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tgju_rates.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
